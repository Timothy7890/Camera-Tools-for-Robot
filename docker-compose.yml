services:
  calib-cloud:
    build: .
    image: calib-cloud:latest
    container_name: calib-cloud
    restart: unless-stopped
    ports:
      - "${CALIB_PORT:-8080}:8080"
    env_file:
      - .env
    volumes:
      # 产物文件 + SQLite 都在这里；备份只需备份这个目录
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
