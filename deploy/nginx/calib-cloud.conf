# Nginx 反向代理（参考 netbridge 的 deploy/nginx/netbridge-controller.conf）。
# deploy/nginx/setup.sh 会把本文件安装到 /etc/nginx/sites-available/calib-cloud 并签发证书。
# 后端 uvicorn 只监听 127.0.0.1:8080（.env 里 CALIB_HOST=127.0.0.1），前端 dist 也由后端同源托管，
# 所以这里把所有请求都反代过去即可。

server {
    listen 80;
    listen [::]:80;
    server_name bwt.xingxingdiandian.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bwt.xingxingdiandian.xyz;

    ssl_certificate /etc/letsencrypt/live/bwt.xingxingdiandian.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bwt.xingxingdiandian.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:CalibTLS:10m;

    # 机器人一次推送 = manifest + 多个结果文件（单文件上限 CALIB_MAX_FILE_MB=64），整包给到 256m
    client_max_body_size 256m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 接口：上传大文件时别让 nginx 先落盘再转发
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        include proxy_params;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # 前端构建产物（vite 带 hash，可长缓存）
    location /assets/ {
        proxy_pass http://127.0.0.1:8080;
        include proxy_params;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # URDF / STL 模型文件内容随版本发布，浏览器可长期复用
    location /models/ {
        proxy_pass http://127.0.0.1:8080;
        include proxy_params;
        add_header Cache-Control "public, max-age=86400";
    }

    # SPA 页面，由后端回 index.html
    location / {
        proxy_pass http://127.0.0.1:8080;
        include proxy_params;
        add_header Cache-Control "no-cache";
    }
}
