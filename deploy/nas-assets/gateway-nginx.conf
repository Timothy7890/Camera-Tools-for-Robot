user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

# 公网只开放 5000：普通 HTTP 继续进入旧站点，TLS 转发给机器人资源服务。
stream {
    map $ssl_preread_protocol $gateway_upstream {
        ""      127.0.0.1:8080;
        default robot-assets:443;
    }

    resolver 127.0.0.11 ipv6=off valid=30s;

    server {
        listen 80;
        listen [::]:80;
        proxy_pass $gateway_upstream;
        proxy_connect_timeout 5s;
        proxy_timeout 300s;
        ssl_preread on;
    }
}

http {
    client_header_buffer_size 16k;
    large_client_header_buffers 4 16k;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 8080;
        listen [::]:8080;
        server_name progress.timoyx.xyz progress.timo0604.xyz;
        client_max_body_size 16m;
        location / {
            proxy_pass http://my-progress:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name nas.timoyx.xyz nas.timo0604.xyz;
        location / {
