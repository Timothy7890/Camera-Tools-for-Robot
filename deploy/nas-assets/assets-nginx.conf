user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    types {
        application/xml urdf;
    }
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    etag on;
    gzip on;
    gzip_types application/xml text/xml;

    map $uri $asset_cache_control {
        default      "public, max-age=604800";
        ~*\.urdf$    "no-cache";
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name robot-assets.timo0604.xyz;

        ssl_certificate /acme.sh/robot-assets.timo0604.xyz_ecc/fullchain.cer;
        ssl_certificate_key /acme.sh/robot-assets.timo0604.xyz_ecc/robot-assets.timo0604.xyz.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:RobotAssetsTLS:10m;
        ssl_session_timeout 1d;

        add_header X-Content-Type-Options nosniff always;
        add_header Cross-Origin-Resource-Policy cross-origin always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /models/ {
            alias /srv/models/;
            limit_except GET HEAD { deny all; }

            add_header Access-Control-Allow-Origin "https://bwt.xingxingdiandian.xyz" always;
            add_header Vary Origin always;
            add_header Cross-Origin-Resource-Policy cross-origin always;
            add_header Cache-Control $asset_cache_control always;
        }

        location / {
            return 404;
        }
    }
}
